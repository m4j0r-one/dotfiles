conky.text = [[
${voffset 8}${color3}${font conthrax:size=12:bold}THERMAL STATUS${alignr}${color6}========${font}
${color3}${hr 2}
${voffset 5}${color1}CPU${goto 55}${color2}${execi 5 sensors | awk '/Tctl/ {print $2}' | sed 's/^ *//'}${goto 165}${color1}SSD1${goto 225}${color2}${execi 15 sensors nvme-pci-1200 | grep 'Sensor 1' | cut -c10-21 | sed 's/^ *//'}${goto 285}${color1}SSD2${goto 355}${color2}${execi 15 sensors nvme-pci-0400 | grep 'Sensor 1' | cut -c10-21 | sed 's/^ *//'}
]]
