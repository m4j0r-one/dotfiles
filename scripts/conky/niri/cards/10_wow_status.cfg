conky.config = {
    out_to_x = false,
    out_to_wayland = true,
    alignment = 'top_left',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    double_buffer = true,
    update_interval = 2,
    uppercase = false,
    use_spacer = 'none',
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,

    default_color = 'D8F6FF',
    color1 = '8CEFFF',
    color2 = 'F4F7FF',
    color3 = 'FF2FAE',
    color4 = '00E5FF',
    color5 = '8A2CFF',
    color6 = '2B0A33',

    minimum_height = 108,
    minimum_width = 275,
    maximum_width = 275,
    gap_x = 560,
    gap_y = 35,

    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,

    use_xft = true,
    xftalpha = 0.98,
    font = 'conthrax:size=7',

    own_window = true,
    own_window_class = 'ConkyCardWowStatus',
    own_window_colour = '0B0612',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 90,
    own_window_type = 'desktop',
    imlib_cache_size = 0,
    stippled_borders = 0,
};

conky.text = [[
${voffset 8}${color5}${font conthrax:size=11:bold}WOW STATUS${alignr}${color6}======${font}
${color3}${hr 2}
${voffset 5}${color1}WoW ${color2}${execi 10 if pgrep -fa "WoW\.exe.*-launcherlogin|_retail_.*WoW\.exe|Z:.*WoW\.exe" >/dev/null; then echo ON; else echo OFF; fi}${alignr}${color1}BNet ${color2}${execi 10 if pgrep -fa "Battle\.net\.exe|Battle\.net|Agent\.exe" >/dev/null; then echo ON; else echo OFF; fi}
${color1}Steam ${color2}${execi 10 if pgrep -x steam >/dev/null; then echo ON; else echo OFF; fi}${alignr}${color1}Session ${color2}${execi 20 bash -c 'pid=$(pgrep -n -f "WoW\.exe.*-launcherlogin|_retail_.*WoW\.exe|Z:.*WoW\.exe"); [ -n "$pid" ] && ps -p "$pid" -o etime= | xargs || echo --'}
${color1}Launcher ${color2}${execi 10 if pgrep -fa "Battle\.net\.exe|Battle\.net|Agent\.exe" >/dev/null; then echo READY; else echo IDLE; fi}
]]
