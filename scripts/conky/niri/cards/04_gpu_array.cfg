conky.text = [[
${voffset 8}${color4}${font conthrax:size=12:bold}GPU ARRAY${alignr}${color6}========${font}
${color4}${hr 2}
${voffset 5}${color1}Core${goto 58}${color2}${execi 3 grep -Po '\d+:\s\K(\d+)(?=.*\*$)' /sys/class/drm/card1/device/pp_dpm_sclk} MHz${goto 165}${color1}Load${goto 225}${color2}${execi 3 cat /sys/class/drm/card1/device/gpu_busy_percent}%${goto 285}${color1}VRAM${goto 355}${color2}${execi 3 numfmt --to=iec < /sys/class/drm/card1/device/mem_info_vram_used}
${color1}Edge${goto 58}${color2}${execi 5 sensors | grep edge | cut -c 16-23}${goto 165}${color1}Junction${goto 225}${color2}${execi 5 sensors | grep junction | cut -c 16-23}${goto 285}${color1}Driver${goto 355}${color2}Mesa ${execi 600 glxinfo | grep Version | cut -c 14-23}
]]
