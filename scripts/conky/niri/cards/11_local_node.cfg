conky.config = {
    out_to_x = false,
    out_to_wayland = true,
    alignment = 'top_left',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    double_buffer = true,
    update_interval = 2,
    uppercase = false,
    use_spacer = 'none',
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,

    default_color = 'D8F6FF',
    color1 = '8CEFFF',
    color2 = 'F4F7FF',
    color3 = 'FF2FAE',
    color4 = '00E5FF',
    color5 = '8A2CFF',
    color6 = '2B0A33',

    minimum_height = 124,
    minimum_width = 275,
    maximum_width = 275,
    gap_x = 560,
    gap_y = 153,

    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,

    use_xft = true,
    xftalpha = 0.98,
    font = 'conthrax:size=7',

    own_window = true,
    own_window_class = 'ConkyCardLocalNode',
    own_window_colour = '0B0612',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 90,
    own_window_type = 'desktop',
    imlib_cache_size = 0,
    stippled_borders = 0,
};

conky.text = [[
${voffset 8}${color4}${font conthrax:size=11:bold}LOCAL NODE${alignr}${color6}======${font}
${color4}${hr 2}
${voffset 5}${color1}Uptime ${color2}$uptime_short${alignr}${color1}Updates ${color2}${execpi 1800 checkupdates 2>/dev/null | awk 'END { print (NR == 0 ? "OK" : NR); }'}
${color1}BT ${color2}${execi 15 if bluetoothctl show 2>/dev/null | grep -q "Powered: yes"; then echo ON; else echo OFF; fi}${alignr}${color1}Netz ${color2}${execi 15 if ping -c 1 -W 1 1.1.1.1 >/dev/null 2>&1; then echo ONLINE; else echo OFFLINE; fi}
${color1}HA ${color2}${execi 60 if curl -k -L -s --max-time 2 https://ha.m4j0r.one >/dev/null; then echo OK; else echo DOWN; fi}${alignr}${color1}NC ${color2}${execi 60 if curl -k -L -s --max-time 2 https://cloud.m4j0r.one >/dev/null; then echo OK; else echo DOWN; fi}
${color1}PPL ${color2}${execi 60 if curl -k -L -s --max-time 2 http://YOUR_SERVER_IP:8000 >/dev/null; then echo OK; else echo DOWN; fi}${alignr}${color1}Backup ${execpi 60 $HOME/scripts/Conky/backup/backup_status_compact.sh}
]]
